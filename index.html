<!DOCTYPE html>
<html>

<head>

    <title>Profil Shizuu</title>

    <style>

        body{
            background-image:url("background langit.jpg");
            background-size:110%;
            background-position:center;
            background-repeat:no-repeat;

            animation:gerakBackground 15s infinite alternate;

            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#2b2b40;
            width:320px;
            padding:25px;
            border-radius:20px;
            text-align:center;

            animation:muncul 1s;
        }

        img{
            width:150px;
            height:150px;
            border-radius:50%;
        }

        h1{
            color:white;
        }

        p{
            color:#cfcfcf;
        }

        a{
            display:block;
            margin-top:20px;
            background:red;
            color:white;
            padding:12px;
            border-radius:10px;
            text-decoration:none;
        }

        /* Animasi Background */
        @keyframes gerakBackground{

            from{
                background-position:left center;
            }

            to{
                background-position:right center;
            }

        }

        /* Animasi Card */
        @keyframes muncul{

            from{
                opacity:0;
                transform:translateY(50px);
            }

            to{
                opacity:1;
                transform:translateY(0);
            }

        }

    </style>

</head>

<body>

<div class="card">

<img src="profile.jpg">

<h1>Shizuu</h1>

<p>Content Creator</p>

<a href="https://youtube.com/@shizuu45">
📺 Channel YouTube
</a>

</div>

</body>

</html>
